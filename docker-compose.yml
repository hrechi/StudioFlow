# ReFrame — full stack in one command:  docker compose up --build
# Reads AUTH_SECRET / ADMIN_EMAIL / ADMIN_PASSWORD from .env (copy .env.example). See README > "Run with Docker".
name: reframe

x-mongo-uri: &mongo-uri mongodb://mongo:27017/reframe

services:
  mongo:
    image: mongo:8.3.13 # the mongo-data volume has FCV 8.3: MongoDB cannot downgrade, so never pin an older version
    attach: false # keep `docker compose up` readable; see its logs with `docker compose logs mongo`
    restart: unless-stopped
    ports:
      - "27018:27017" # Compass: mongodb://127.0.0.1:27018 (27017 stays free for a local MongoDB)
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--host",
          "127.0.0.1",
          "--quiet",
          "--eval",
          "try { if (db.adminCommand({ ping: 1 }).ok !== 1) quit(1); } catch (error) { quit(1); }",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Reconciles the ADMIN and fills every module with demo data. ON DEMAND ONLY (profile "seed"):
  # `docker compose up` no longer runs it, so your data is never re-seeded. To seed on purpose:
  #   docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: tools # no `next build` here: only the app image builds Next (saves memory and time)
    command: ["npm", "run", "seed:all"]
    attach: false # keep `docker compose up` readable; see its output with `docker compose logs seed`
    environment:
      MONGODB_URI: *mongo-uri
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SEED_CLIENT_PASSWORD: ${SEED_CLIENT_PASSWORD:-} # docker compose --profile seed run --rm seed npx tsx scripts/seed-facturation.ts
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach Ganache on the host (built in on Docker Desktop)
    ports:
      - "${APP_PORT:-3000}:3000" # APP_PORT in .env if 3000 is taken (e.g. by npm run dev)
    environment:
      MONGODB_URI: *mongo-uri
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (e.g. openssl rand -base64 32)}
      # SnapSeal network and contract addresses; empty addresses keep the feature inactive.
      SNAPSEAL_NETWORK: ${SNAPSEAL_NETWORK:-sepolia}
      SNAPSEAL_REGISTRY_ADDRESS: ${SNAPSEAL_REGISTRY_ADDRESS:-}
      SNAPSEAL_DELIVERY_ADDRESS: ${SNAPSEAL_DELIVERY_ADDRESS:-}
      SNAPSEAL_RPC_URL: ${SNAPSEAL_RPC_URL:-}
      # The server now READS the chain (gates, verified seals); from a container that is the host's Ganache.
      SNAPSEAL_SERVER_RPC_URL: ${DOCKER_BLOCKCHAIN_RPC_URL:-http://host.docker.internal:7545}
      # Contract notary (contrats): the server calls Ganache running on your machine, so not 127.0.0.1.
      BLOCKCHAIN_RPC_URL: ${DOCKER_BLOCKCHAIN_RPC_URL:-http://host.docker.internal:7545}
      STUDIO_PRIVATE_KEY: ${STUDIO_PRIVATE_KEY:-}
      NOTARY_ADDRESS: ${NOTARY_ADDRESS:-}
      # Equipment allocation: same Ganache. The browser (MetaMask) uses 127.0.0.1, the server host.docker.internal.
      NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-1337}
      NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-http://127.0.0.1:7545}
      GANACHE_RPC_URL: ${DOCKER_BLOCKCHAIN_RPC_URL:-http://host.docker.internal:7545}
      # Online payments (Konnect sandbox/production); without keys the test checkout is used if enabled.
      APP_URL: ${APP_URL:-http://localhost:3000}
      KONNECT_API_KEY: ${KONNECT_API_KEY:-}
      KONNECT_WALLET_ID: ${KONNECT_WALLET_ID:-}
      KONNECT_API_URL: ${KONNECT_API_URL:-https://api.sandbox.konnect.network/api/v2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-} # Claude Haiku: photo analysis, culling, story order, AI search
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-} # chatbot, AI payment proof checker, portfolio AI
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-} # spare keys, tried on quota errors
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-} # chatbot, pack suggestions
      GROQ_MODEL: ${GROQ_MODEL:-}
      STUDIO_CONTACT_EMAIL: ${STUDIO_CONTACT_EMAIL:-} # given by the chatbot
      STUDIO_CONTACT_PHONE: ${STUDIO_CONTACT_PHONE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_TND_EUR_RATE: ${STRIPE_TND_EUR_RATE:-0.3}
      PAIEMENT_SIMULATION: ${PAIEMENT_SIMULATION:-true} # local demo only: set false on a real server
      # Optional AI features (avis-reclamations); empty = disabled
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_PROFANITY_HOST: ${RAPIDAPI_PROFANITY_HOST:-}
      RAPIDAPI_PROFANITY_URL: ${RAPIDAPI_PROFANITY_URL:-}
      # Portfolio module
      USE_MOCKS: ${USE_MOCKS:-false}
      PORTFOLIO_BASE_URL: ${PORTFOLIO_BASE_URL:-http://localhost:3000}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy

  elasticsearch:
    image: elasticsearch:8.17.0
    attach: false # keep `docker compose up` readable; see its logs with `docker compose logs elasticsearch`
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      # Log only warnings and errors; hide the "clock went backwards" warnings caused by WSL2 clock drift.
      - logger.level=WARN
      - logger.org.elasticsearch.threadpool=ERROR # the image only reads lowercase setting names
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  mongo-data:
  es-data:
